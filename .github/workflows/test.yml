name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      # Gated on tests/ only. The integration source predates this suite and
      # carries pre-existing findings; cleaning it up is a separate change.
      - name: Lint tests
        run: |
          ruff check tests
          ruff format --check tests

      - name: Lint integration source (advisory)
        continue-on-error: true
        run: ruff check custom_components

      - name: Unit tests
        run: pytest -m "not e2e" --cov=custom_components/choremander --cov-report=term-missing

  end-to-end:
    name: End-to-end against a real Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          cd e2e && npm ci && npx playwright install --with-deps chromium

      # start.sh brings the container up, completes onboarding over the REST
      # API, mints a token, and blocks until Choremander has actually loaded.
      - name: Start Home Assistant
        run: ./dev/start.sh

      - name: API end-to-end tests
        run: pytest -m e2e

      - name: Browser end-to-end tests
        run: cd e2e && npx playwright test

      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=300 homeassistant

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
